name: Standalone desktop CI

on:
  push:
    branches:
      - main
      - feature/standalone-desktop-agent
      - feature/manucodeai-ui-auth-billing
  pull_request:
    branches:
      - main
      - feature/standalone-desktop-agent
      - feature/manucodeai-ui-auth-billing
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r desktop/requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q desktop run_desktop.py

      - name: Run desktop-agent tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
