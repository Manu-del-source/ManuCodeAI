name: Build desktop releases

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example v1.0.0). Leave blank to build test artifacts only."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r desktop/requirements.txt
          python -m pip install pyinstaller
      - name: Build desktop application
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name ManuCodeAI --collect-all PySide6 --collect-all shiboken6 --collect-all keyring run_desktop.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } elseif ("${{ inputs.release_tag }}" -ne "") { "${{ inputs.release_tag }}" } else { "0.0.0-test" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/windows/ManuCodeAI.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManuCodeAI-Windows
          path: dist/installer/ManuCodeAI-Setup.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage and portable archive
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xdotool xclip libfuse2
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r desktop/requirements.txt
          python -m pip install pyinstaller
      - name: Build desktop application
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name ManuCodeAI --collect-all PySide6 --collect-all shiboken6 --collect-all keyring run_desktop.py
      - name: Create portable archive
        run: |
          mkdir -p dist/portable
          cp -a dist/ManuCodeAI dist/portable/
          tar -C dist/portable -czf dist/ManuCodeAI-linux-x86_64.tar.gz ManuCodeAI
      - name: Assemble AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp -a dist/ManuCodeAI AppDir/usr/bin/
          cp packaging/linux/manucodeai.desktop AppDir/
          cp packaging/linux/manucodeai.desktop AppDir/usr/share/applications/
          cp packaging/linux/manucodeai.svg AppDir/manucodeai.svg
          cp packaging/linux/manucodeai.svg AppDir/usr/share/icons/hicolor/scalable/apps/manucodeai.svg
          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir dist/ManuCodeAI-x86_64.AppImage
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ManuCodeAI-Linux
          path: |
            dist/ManuCodeAI-x86_64.AppImage
            dist/ManuCodeAI-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: ManuCodeAI-Windows
          path: release-assets
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: ManuCodeAI-Linux
          path: release-assets
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
